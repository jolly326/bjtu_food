# 生产环境配置（profile=prod 覆盖 application.yml）
# 云托管/服务器部署在环境变量注入 SPRING_PROFILES_ACTIVE=prod 后生效。

# 关闭 OpenAPI 文档与 Swagger UI（P1-7/BE-100）：生产环境不对外暴露接口拓扑与调试入口。
# 若需临时排障开启，可在环境变量注入 SPRINGDOC_API_DOCS_ENABLED=true / SPRINGDOC_SWAGGER_UI_ENABLED=true。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# JWT 签名密钥（BE-11）：生产刻意**不提供默认值**——此处写 ${JWT_SECRET}（无 :default），
# 一旦环境变量未注入，占位符无法解析，Spring 在装配阶段即抛错终止启动（fail-fast），
# 杜绝「线上沿用 application.yml 里的仓库内置默认密钥 → 任意 userId 的 Token 可被伪造」。
# 开发环境（profile=dev）不受影响：仍走 application.yml 的 ${JWT_SECRET:BjtuFoodDevSecretKey2024ChangeMe}。
jwt:
  secret: ${JWT_SECRET}
