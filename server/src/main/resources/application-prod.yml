# 生产环境配置（profile=prod 覆盖 application.yml）
# 云托管/服务器部署在环境变量注入 SPRING_PROFILES_ACTIVE=prod 后生效。

# ---------- Actuator 运维端点（2026-09-28 架构收口 D）----------
# 仅暴露探活与基础信息；**不**暴露 env / beans / configprops / heapdump / threaddump
# （这些端点会泄露数据库连接串、密钥与环境变量，属公网高危面）。
# 端点路径带版本前缀：/api/v1/actuator/health
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never      # 不返回各依赖明细，避免暴露内部拓扑
  info:
    env:
      enabled: true

# 日志归档目录（logback-spring.xml 读取；容器部署建议挂载持久卷）
logging:
  file:
    path: ${LOG_PATH:./logs}

# 关闭 OpenAPI 文档与 Swagger UI（P1-7/BE-100）：生产环境不对外暴露接口拓扑与调试入口。
# 与 application.yml 共用同一组环境变量，prod 只是把默认值由 true 改为 false；
# 临时排障需开启时注入 SPRINGDOC_API_DOCS_ENABLED=true 即可，无需改本文件。
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

# JWT 签名密钥（BE-11）：生产刻意**不提供默认值**——此处写 ${JWT_SECRET}（无 :default），
# 一旦环境变量未注入，占位符无法解析，Spring 在装配阶段即抛错终止启动（fail-fast），
# 杜绝「线上沿用 application.yml 里的仓库内置默认密钥 → 任意 userId 的 Token 可被伪造」。
# 开发环境（profile=dev）不受影响：仍走 application.yml 的 ${JWT_SECRET:BjtuFoodDevSecretKey2024ChangeMe}。
jwt:
  secret: ${JWT_SECRET}
