# ============================================================
# 校园食堂信息系统 - 应用主配置
# ============================================================

server:
  port: 8080                    # 服务端口
  address: 0.0.0.0
  # ---------- HTTP 响应压缩 ----------
  # JSON/文本响应体积降约 60-70%，对移动网络收益最大；低于 min-response-size 的响应不压缩。
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html,text/plain
    min-response-size: 1024
  servlet:
    # 统一接口前缀 = /api + 版本段。
    # 2026-09-28 起启用版本段（业界标准做法）：v1 为首个契约版本。
    # 破坏性变更时新增 v2 并保留 v1 一段过渡期，双份并行、端上逐步迁移后再摘除 v1。
    # 注意：版本段写在此处（context-path）而非各 Controller 的 @RequestMapping，
    # 故 38 个端点映射零改动；SecurityConfig 白名单与 AdminTokenFilter 作用域
    # 均按「应用内路径」（已剥离 context-path）判定，升版不影响二者。
    context-path: /api/v1

# ---------- 管理端鉴权（TD-18 / TD-19 / TD-20）----------
# 管理员账号密码登录：POST /admin/auth/login 签发管理端 JWT，此后请求带 Authorization: Bearer <token>。
# 🔴 admin.jwt.secret 必须**独立于** spring.jwt.secret（JWT_SECRET）—— 共用则学生 token 可被当作管理端凭证；
# 🔴 必须**固定**：每次启动重新生成会使已登录 token 全部失效（用户被反复踢出登录）。
# 取值要求：≥32 字节随机串（openssl rand -base64 48）；未配置或过弱时**启动即失败**（fail-fast）。
#
# 🗑️ 原静态口令配置 admin.token（环境变量 ADMIN_TOKEN）已随 TD-20 删除 —— 口令须在前后端各存一份，
#    而前端那份会被 Vite 打进产物，bundle 一旦离开本机即永久失守且无法吊销。
admin:
  jwt:
    secret: ${ADMIN_JWT_SECRET:}
    # token 有效期（秒）。86400 = 24h，对应设计口径「一人偶尔用，过期后重登成本低」。
    expiration-seconds: 86400

spring:
  application:
    name: bjtu-food

  # ---------- 数据源配置 ----------
  # 凭据一律从环境变量注入，禁止在仓库写入明文。
  # 本地开发：复制 .env.example 为 server/.env，由 spring-dotenv 依赖自动加载（优先级：系统环境变量 > server/.env > 此处默认值）。
  # 云托管/生产：直接在云托管环境变量中配置同名变量（优先级最高），无需 .env 文件。
  # 注意：原 application-secret.yml（曾含 SMTP 明文）已移除并加入 .gitignore，敏感配置全部改由环境变量注入，仓库不再保留任何明文凭据。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bjtu_food?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    # 连接池显式化（2026-09-29）：此前用 Spring 默认（maximum-pool-size=10），未显式声明 ⇒
    # 上限随框架版本漂移、出问题难以定位。配合「机审移出事务」一并收口：
    #   · maximum-pool-size：按云托管 0.5G 实例与并发写量定为 20（写路径事务已只包住落库，占用极短）
    #   · connection-timeout：借不到连接最多等 30s 后明确报错，避免请求无限堆积
    #   · leak-detection-threshold：超过 60s 未归还即 WARN 并打印借用栈，用于发现「连接被长期占用」回归
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      leak-detection-threshold: 60000

  # ---------- 文件上传配置 ----------
  servlet:
    multipart:
      max-file-size: 5MB        # 单文件最大 5MB
      max-request-size: 20MB    # 单次请求最大 20MB

  # ---------- SMTP 邮件配置（网易 163） ----------
  # 发件邮箱与授权码一律从环境变量 SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD 注入，禁止在仓库写入明文。
  # 本地开发：复制 .env.example 为 server/.env 并填入真实授权码，由 spring-dotenv 依赖自动加载。
  # 网易 SMTP：host=smtp.163.com，端口 465（SSL）/ 994（SSL）。授权码在网易邮箱网页版「设置→POP3/SMTP/IMAP」开启后生成。
  mail:
    host: smtp.163.com
    port: 465
    protocol: smtp
    default-encoding: UTF-8
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
          socketFactoryClass: javax.net.ssl.SSLSocketFactory

  # ---------- Jackson 日期序列化 ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss   # 日期格式
    time-zone: Asia/Shanghai           # 时区

# ---------- MyBatis-Plus 配置 ----------
mybatis-plus:
  # ---------- XML 映射文件扫描路径 ----------
  # 2026-09-28 架构收口 P2：资源目录与 Java 侧分包对齐——XML 按业务域下沉到
  # mapper/<域>/XxxMapper.xml（与 src/main/java/com/bjtufood/<域>/mapper 对称），
  # 不再是扁平的单层 mapper/。通配 `**` 同时覆盖下层目录与未来新增的域。
  # 注：显式声明而非依赖默认值，使目录约定可被本文件直接读出。
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 默认（生产）不打印 SQL；本地开发由 application-dev.yml 覆盖为 StdOutImpl
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    # 数据库字段下划线命名 <-> Java 实体类驼峰命名自动映射
    map-underscore-to-camel-case: true

# ---------- JWT 配置 ----------
jwt:
  # JWT 签名密钥：生产/云端必须从环境变量 JWT_SECRET 注入强随机密钥，禁止明文入库。
  # 本地开发默认值仅供调试，切勿直接用于生产。
  secret: ${JWT_SECRET:BjtuFoodDevSecretKey2024ChangeMe}
  # Token 过期时间：7 天（604800000ms）。
  # 小程序端过期后经静默登录自动换取新 token；注销/禁用仍可通过 TokenBlacklist 立即失效。
  expiration: 604800000

# ---------- SpringDoc OpenAPI (Swagger) ----------
# 默认**关闭**（2026-09-29 安全默认）：避免「部署漏设 SPRING_PROFILES_ACTIVE=prod」时
# /swagger-ui/** 与 /v3/api-docs 仍被公网直接访问、暴露全量接口拓扑（含 /admin/** 与鉴权方案）。
# 本地联调由 application-dev.yml（profile=dev）显式开启；临时排障亦可注入
# SPRINGDOC_API_DOCS_ENABLED=true / SPRINGDOC_SWAGGER_UI_ENABLED=true 覆盖。
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

# ---------- CORS 受信任前端源 ----------
# 仅放行白名单内的浏览器源（逗号分隔）；微信小程序 wx.request 不带 Origin 头，不受影响。
# 未配置时拒绝一切带 Origin 的浏览器跨域请求（仅小程序/服务端可达）。
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# ---------- 应用公共基础 URL ----------
app:
  # 供上传模块拼接完整图片 URL（局域网调试改为本机 IP）
  # 必须含版本段，与 server.servlet.context-path 保持一致，否则上传返回的图片 URL 会 404
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080/api/v1}

# ---------- 文件上传存储路径 ----------
upload:
  # 上传文件存储的相对路径（相对于项目根目录）
  path: ${UPLOAD_PATH:./uploads/images}
  # 上传文件 URL 访问前缀
  url-prefix: ${UPLOAD_URL_PREFIX:/images}

# ---------- 微信小程序（code2Session） ----------
# appid / secret 一律从环境变量注入，禁止在仓库写入明文。
wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}
  # 小程序登录凭证校验（code2Session）接口地址（GET）
  code2session-url: ${WECHAT_CODE2SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
  # 微信云开发（CloudBase）环境 ID：tcb/batchdownloadfile 拉取云存储临时链接用。
  # 缺省为空时后端尝试从 fileID（cloud://{env}.{bucket}/path）自动解析，仅当解析失败才要求显式配置。
  cloud-env: ${WECHAT_CLOUD_ENV:}

# ---------- 腾讯云 COS 对象存储（UGC 配图最终存储） ----------
# 四项均从环境变量注入；任一缺失视为「COS 未配置」，/upload/cloud-image 返回 400「图片存储未配置」，
# 管理端 multipart /admin/upload 降级本地磁盘存储（开发环境无 COS 仍可用）。
cos:
  bucket: ${COS_BUCKET:}
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  region: ${COS_REGION:}
