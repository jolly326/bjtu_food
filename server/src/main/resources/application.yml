# ============================================================
# 校园食堂信息系统 - 应用主配置
# ============================================================

server:
  port: 8080                    # 服务端口
  address: 0.0.0.0
  servlet:
    context-path: /api          # 所有接口统一前缀（如 /api/dishes）

spring:
  application:
    name: bjtu-food

  # ---------- 敏感配置引入 ----------
  # 引入 application-secret.yml（含 SMTP 发件邮箱/授权码，已加入 .gitignore，不随仓库提交）。
  # optional：文件缺失时不报错（如生产环境用环境变量注入），存在则默认加载。
  config:
    import: optional:classpath:application-secret.yml

  # ---------- 数据源配置 ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bjtu_food?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: oi
    password: "060326"

  # ---------- 文件上传配置 ----------
  servlet:
    multipart:
      max-file-size: 5MB        # 单文件最大 5MB
      max-request-size: 20MB    # 单次请求最大 20MB

  # ---------- SMTP 邮件配置 ----------
  # 发件邮箱与授权码由 application-secret.yml 提供（spring.mail.username / spring.mail.password），
  # 经上方 spring.config.import 自动加载；也可用环境变量 SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD 覆盖。
  mail:
    host: smtp.qq.com
    port: 465
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
          socketFactoryClass: javax.net.ssl.SSLSocketFactory

  # ---------- Jackson 日期序列化 ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss   # 日期格式
    time-zone: Asia/Shanghai           # 时区

# ---------- MyBatis-Plus 配置 ----------
mybatis-plus:
  configuration:
    # 开发环境打印 SQL（方便调试），生产环境关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 数据库字段下划线命名 <-> Java 实体类驼峰命名自动映射
    map-underscore-to-camel-case: true
# ---------- Knife4j API 文档配置 ----------
knife4j:
  enable: true

# ---------- JWT 配置 ----------
jwt:
  # JWT 签名密钥（生产环境请更换为复杂密钥）
  secret: BjtuFoodSecretKey2024ForJwtTokenSigning
  # Token 过期时间：产品决策「不设置登录超时」，token 长期有效（100年 ≈ 3153600000000ms）
  # 注销/禁用仍可通过 TokenBlacklist 立即失效，不影响账号安全
  expiration: 3153600000000

# ---------- 应用公共基础 URL ----------
app:
  # 供上传模块拼接完整图片 URL（局域网调试改为本机 IP）
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080/api}

# ---------- 文件上传存储路径 ----------
upload:
  # 上传文件存储的相对路径（相对于项目根目录）
  path: ${UPLOAD_PATH:./uploads/images}
  # 上传文件 URL 访问前缀
  url-prefix: ${UPLOAD_URL_PREFIX:/images}
